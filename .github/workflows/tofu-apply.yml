name: "OpenTofu Apply & Cluster Bootstrap"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "OpenTofu Action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan
      target:
        description: "Infrastructure stack to target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gcp
          - cloudflare
      allow_node_replacement:
        description: "Allow destroying/replacing RKE2 node VMs (DANGEROUS: wipes etcd and all cluster data)"
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - main
    paths:
      - "tofu/**"
      - ".github/workflows/tofu-apply.yml"

permissions:
  contents: read
  id-token: write

# Workflow-level concurrency: deduplicate rapid duplicate pull_request events
# for the same PR (e.g., when a stacked rebase updates both base and head refs),
# while never canceling non-PR (push / workflow_dispatch) runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('opentofu-pr-{0}', github.event.pull_request.number) || format('opentofu-main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tofu:
    name: "OpenTofu Plan/Apply & Bootstrap"
    runs-on: ubuntu-latest
    # Job-level concurrency: serialize all OpenTofu state operations across PRs
    # and main in a single FIFO queue (up to 100 pending runs) without canceling.
    concurrency:
      group: opentofu-infra
      cancel-in-progress: false
      queue: max
    env:
      ACTION: ${{ github.event_name == 'pull_request' && 'plan' || github.event.inputs.action || 'apply' }}
      TF_IN_AUTOMATION: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Changed Stacks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ github.event.inputs.target || 'all' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          event = os.environ.get("EVENT_NAME", "")
          target = os.environ.get("INPUT_TARGET", "all")
          run_gcp = False
          run_cloudflare = False

          if event == "workflow_dispatch":
              run_gcp = target in ("all", "gcp")
              run_cloudflare = target in ("all", "cloudflare")
          else:
              base_sha = os.environ.get("PR_BASE_SHA", "") if event == "pull_request" else os.environ.get("PUSH_BEFORE_SHA", "")
              if not base_sha or base_sha == "0" * 40:
                  run_gcp = True
                  run_cloudflare = True
              else:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", base_sha, "HEAD"],
                      text=True,
                  ).splitlines()
                  for path in changed:
                      if path == ".github/workflows/tofu-apply.yml":
                          run_gcp = True
                          run_cloudflare = True
                      elif path.startswith("tofu/cloudflare/"):
                          run_cloudflare = True
                      elif path.startswith("tofu/"):
                          run_gcp = True

          print(f"Detected stacks -> run_gcp={run_gcp}, run_cloudflare={run_cloudflare}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run_gcp={str(run_gcp).lower()}\n")
              out.write(f"run_cloudflare={str(run_cloudflare).lower()}\n")
          PY

      - name: No Infrastructure Changes Detected
        if: steps.changes.outputs.run_gcp != 'true' && steps.changes.outputs.run_cloudflare != 'true'
        run: echo "Neither GCP nor Cloudflare OpenTofu files changed; skipping OpenTofu checks."

      - name: Authenticate to Google Cloud (WIF)
        if: steps.changes.outputs.run_gcp == 'true' || steps.changes.outputs.run_cloudflare == 'true'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.changes.outputs.run_gcp == 'true' || steps.changes.outputs.run_cloudflare == 'true'
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Start Stopped RKE2 VMs (Merge to Main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.changes.outputs.run_gcp == 'true' || steps.changes.outputs.run_cloudflare == 'true')
        run: |
          for i in {1..24}; do
            STOPPING=$(gcloud compute instances list \
              --filter="name~'^rke2-node-' AND status=STOPPING" \
              --format="value(name)")
            if [ -z "$STOPPING" ]; then
              break
            fi
            echo "Waiting for stopping RKE2 VMs to reach TERMINATED (${i}/24): ${STOPPING}"
            sleep 5
          done

          STOPPED=$(gcloud compute instances list \
            --filter="name~'^rke2-node-' AND (status=TERMINATED OR status=SUSPENDED)" \
            --format="csv[no-heading](name,zone.basename())")

          if [ -z "$STOPPED" ]; then
            echo "All RKE2 VMs are already running."
            exit 0
          fi

          echo "Found stopped RKE2 VMs:"
          echo "$STOPPED"

          mapfile -t ZONES < <(printf '%s\n' "$STOPPED" | cut -d',' -f2 | sort -u)
          for ZONE in "${ZONES[@]}"; do
            mapfile -t ZONE_NAMES < <(printf '%s\n' "$STOPPED" | awk -F',' -v z="$ZONE" '$2 == z {print $1}')
            echo "Starting RKE2 VMs in zone ${ZONE}: ${ZONE_NAMES[*]}"
            gcloud compute instances start "${ZONE_NAMES[@]}" --zone="$ZONE" --quiet
          done

      - name: Set up OpenTofu
        if: steps.changes.outputs.run_gcp == 'true' || steps.changes.outputs.run_cloudflare == 'true'
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.13.9"

      - name: Ensure Remote State Bucket
        if: steps.changes.outputs.run_gcp == 'true' || steps.changes.outputs.run_cloudflare == 'true'
        run: |
          PROJECT_ID=$(gcloud config get-value project)

          if ! gcloud storage buckets describe "gs://${PROJECT_ID}-tofu-state" >/dev/null 2>&1; then
            echo "Creating remote state bucket gs://${PROJECT_ID}-tofu-state..."
            gcloud storage buckets create "gs://${PROJECT_ID}-tofu-state" --location=me-west1 --uniform-bucket-level-access
            gcloud storage buckets update "gs://${PROJECT_ID}-tofu-state" --versioning
          fi

      - name: OpenTofu Init & Format / Validate (GCP)
        if: steps.changes.outputs.run_gcp == 'true'
        run: |
          PROJECT_ID=$(gcloud config get-value project)

          cd tofu
          tofu fmt -check
          tofu init \
            -backend-config="bucket=${PROJECT_ID}-tofu-state" \
            -backend-config="prefix=rke2-cluster"
          tofu validate

      - name: OpenTofu Plan (GCP)
        id: plan
        if: steps.changes.outputs.run_gcp == 'true'
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          cd tofu
          tofu plan -input=false -out=tfplan -var="project_id=${PROJECT_ID}"

      - name: Guard Against Node VM Replacement
        if: steps.changes.outputs.run_gcp == 'true'
        env:
          ALLOW_NODE_REPLACEMENT: ${{ github.event.inputs.allow_node_replacement || 'false' }}
        run: |
          cd tofu
          # Any delete action on an existing node VM (destroy or replace) destroys the whole
          # HA cluster's etcd/data. Block it unless explicitly allowed via workflow_dispatch.
          REPLACED=$(tofu show -json tfplan | jq -r '.resource_changes[]
            | select(.type == "google_compute_instance")
            | select(.change.actions | index("delete"))
            | "\(.address): \(.change.actions | join("/"))"')
          if [ -n "$REPLACED" ]; then
            echo "::warning::This plan destroys or replaces RKE2 node VMs:"
            echo "$REPLACED"
            if [ "$ALLOW_NODE_REPLACEMENT" != "true" ]; then
              echo "::error::Refusing to continue: node VM replacement wipes the cluster. RKE2 upgrades must go through the System Upgrade Controller. Re-run manually with allow_node_replacement=true if this is intended."
              exit 1
            fi
          else
            echo "No node VM destruction or replacement in this plan."
          fi

      - name: OpenTofu Apply (GCP)
        id: apply
        if: steps.changes.outputs.run_gcp == 'true' && env.ACTION == 'apply' && github.event_name != 'pull_request'
        run: |
          cd tofu
          tofu apply -input=false -auto-approve tfplan

      - name: Bootstrap Cluster, Core Services, Secrets & Domain
        if: steps.changes.outputs.run_gcp == 'true' && env.ACTION == 'apply' && github.event_name != 'pull_request'
        env:
          KUBECONFIG: ${{ github.workspace }}/rke2-kubeconfig.yaml
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
          GOOGLE_OIDC_CLIENT_ID: ${{ secrets.ARGOCD_GOOGLE_OIDC_CLIENT_ID }}
          GOOGLE_OIDC_CLIENT_SECRET: ${{ secrets.ARGOCD_GOOGLE_OIDC_CLIENT_SECRET }}
          ARGOCD_ADMIN_EMAIL: ${{ secrets.ARGOCD_ADMIN_EMAIL || secrets.ACME_EMAIL }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          MONGO_REPLICA_KEY: ${{ secrets.MONGODB_REPLICA_SET_KEY }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME || 'admin' }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          echo "Waiting for rke2-node-1 to finish initialization..."
          for i in {1..40}; do
            if gcloud compute ssh rke2-node-1 --tunnel-through-iap --zone=me-west1-a \
              --command="sudo /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes" 2>/dev/null; then
              echo "rke2-node-1 control-plane is up and healthy!"
              break
            fi
            echo "Waiting for RKE2 startup script on rke2-node-1 (attempt $i/40)..."
            sleep 15
          done

          echo "Fetching kubeconfig from rke2-node-1..."
          gcloud compute ssh rke2-node-1 --tunnel-through-iap --zone=me-west1-a \
            --command="sudo cat /etc/rancher/rke2/rke2.yaml" > rke2-kubeconfig.yaml

          echo "Starting background IAP port-forwarding tunnel to rke2-node-1:6443..."
          gcloud compute start-iap-tunnel rke2-node-1 6443 --local-host-port=localhost:6443 --zone=me-west1-a &
          TUNNEL_PID=$!
          trap "kill $TUNNEL_PID 2>/dev/null || true" EXIT
          sleep 5

          export KUBECONFIG=$(pwd)/rke2-kubeconfig.yaml
          kubectl get nodes -o wide

          echo "Configuring and verifying 3-node replicated GlusterFS /shared storage..."
          for n in rke2-node-1 rke2-node-2 rke2-node-3; do
            echo "Preparing GlusterFS brick disk (/mnt/shared-brick) and daemon on $n..."
            gcloud compute ssh $n --tunnel-through-iap --zone=me-west1-a --command='
              if [ -b "/dev/disk/by-id/google-shared-disk" ]; then
                if ! sudo blkid /dev/disk/by-id/google-shared-disk | grep -q "TYPE="; then
                  sudo mkfs.ext4 -m 0 -F /dev/disk/by-id/google-shared-disk
                fi
                sudo mkdir -p /mnt/shared-brick /shared
                if ! findmnt -M /mnt/shared-brick >/dev/null 2>&1; then
                  UUID=$(sudo blkid -s UUID -o value /dev/disk/by-id/google-shared-disk)
                  if ! grep -q "UUID=$UUID" /etc/fstab; then
                    echo "UUID=$UUID /mnt/shared-brick ext4 defaults,nofail 0 2" | sudo tee -a /etc/fstab
                  fi
                  sudo systemctl daemon-reload && sudo mount /mnt/shared-brick
                fi
                sudo mkdir -p /mnt/shared-brick/brick
                if ! command -v glusterd >/dev/null 2>&1; then
                  sudo DEBIAN_FRONTEND=noninteractive apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y glusterfs-server
                fi
                sudo systemctl enable --now glusterd.service
              fi
            '
          done

          echo "Forming 3-node GlusterFS trusted pool and 'shared-vol' replicated volume..."
          gcloud compute ssh rke2-node-1 --tunnel-through-iap --zone=me-west1-a --command='
            sudo gluster peer probe 10.10.0.12 || true
            sudo gluster peer probe 10.10.0.13 || true
            sleep 5
            if ! sudo gluster volume info shared-vol >/dev/null 2>&1; then
              sudo gluster volume create shared-vol replica 3 \
                10.10.0.11:/mnt/shared-brick/brick \
                10.10.0.12:/mnt/shared-brick/brick \
                10.10.0.13:/mnt/shared-brick/brick force
              sudo gluster volume set shared-vol network.ping-timeout 5
              sudo gluster volume set shared-vol cluster.quorum-type auto
              sudo gluster volume start shared-vol
            elif ! sudo gluster volume info shared-vol | grep -q "Status: Started"; then
              sudo gluster volume start shared-vol || true
            fi
          '

          for n in rke2-node-1 rke2-node-2 rke2-node-3; do
            echo "Mounting GlusterFS volume 'shared-vol' at /shared on $n..."
            gcloud compute ssh $n --tunnel-through-iap --zone=me-west1-a --command='
              sudo mkdir -p /shared
              if ! grep -q "localhost:/shared-vol" /etc/fstab; then
                echo "localhost:/shared-vol /shared glusterfs defaults,_netdev,backup-volfile-servers=10.10.0.11:10.10.0.12:10.10.0.13,x-systemd.requires=glusterd.service 0 0" | sudo tee -a /etc/fstab
              fi
              if ! findmnt -n -o FSTYPE -M /shared 2>/dev/null | grep -q "glusterfs"; then
                sudo systemctl daemon-reload && sudo mount /shared
              fi
            '
          done

          gcloud compute ssh rke2-node-1 --tunnel-through-iap --zone=me-west1-a --command='
            sudo chmod 777 /shared
            sudo mkdir -p /shared/docker-registry && sudo chmod 777 /shared/docker-registry
          '

          echo "Checking /shared GlusterFS mount and volume status across all nodes:"
          gcloud compute ssh rke2-node-1 --tunnel-through-iap --zone=me-west1-a --command='sudo gluster volume status shared-vol' || true
          for n in rke2-node-1 rke2-node-2 rke2-node-3; do
            echo "--- $n /shared ---"
            gcloud compute ssh $n --tunnel-through-iap --zone=me-west1-a --command='df -hT /shared' || true
          done

          echo "Creating core namespaces..."
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace cloudflared --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace mongodb --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace docker-registry --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace devops-demo --dry-run=client -o yaml | kubectl apply -f -

          echo "Injecting secrets from GitHub Secrets..."
          if [ -n "$CF_API_TOKEN" ]; then
            kubectl create secret generic cloudflare-api-token-secret -n cert-manager \
              --from-literal=api-token="$CF_API_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ -n "$CF_TUNNEL_TOKEN" ]; then
            kubectl create secret generic cloudflared-token -n cloudflared \
              --from-literal=token="$CF_TUNNEL_TOKEN" \
              --from-literal=TUNNEL_TOKEN="$CF_TUNNEL_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          if [ -n "$GOOGLE_OIDC_CLIENT_ID" ] && [ -n "$GOOGLE_OIDC_CLIENT_SECRET" ]; then
            kubectl create secret generic argocd-google-oidc -n argocd \
              --from-literal=clientID="$GOOGLE_OIDC_CLIENT_ID" \
              --from-literal=clientSecret="$GOOGLE_OIDC_CLIENT_SECRET" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl label secret argocd-google-oidc -n argocd app.kubernetes.io/part-of=argocd --overwrite
          fi

          if [ -n "$MONGO_ROOT_PASSWORD" ] && [ -n "$MONGO_REPLICA_KEY" ]; then
            kubectl create secret generic mongodb -n mongodb \
              --from-literal=mongodb-root-password="$MONGO_ROOT_PASSWORD" \
              --from-literal=mongodb-replica-set-key="$MONGO_REPLICA_KEY" --dry-run=client -o yaml | kubectl apply -f -
          fi

          echo "Configuring Docker Registry authentication..."
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY_AUTH_CACHE_URI="gs://${PROJECT_ID}-tofu-state/secrets/docker-registry-auth.json"
          REG_USER="${DOCKER_REGISTRY_USERNAME:-admin}"

          if [ -n "$DOCKER_REGISTRY_PASSWORD" ]; then
            REG_PASS="$DOCKER_REGISTRY_PASSWORD"
            sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils
            HTPASSWD_CONTENT=$(htpasswd -Bbn "$REG_USER" "$REG_PASS")
            kubectl create secret generic docker-registry-auth -n docker-registry \
              --from-literal=htpasswd="$HTPASSWD_CONTENT" --dry-run=client -o yaml | kubectl apply -f -
            kubectl get secret docker-registry-auth -n docker-registry -o json \
              | jq 'del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields, .metadata.ownerReferences)' \
              | gcloud storage cp - "${REGISTRY_AUTH_CACHE_URI}" 2>/dev/null || true
          elif ! kubectl get secret docker-registry-auth -n docker-registry >/dev/null 2>&1; then
            if gcloud storage ls "${REGISTRY_AUTH_CACHE_URI}" >/dev/null 2>&1; then
              echo "Restoring cached docker-registry-auth Secret from ${REGISTRY_AUTH_CACHE_URI}..."
              gcloud storage cat "${REGISTRY_AUTH_CACHE_URI}" | kubectl apply -f -
            else
              echo "Generating random initial password for docker-registry user '${REG_USER}'..."
              sudo apt-get update -qq && sudo apt-get install -y -qq apache2-utils
              GENERATED_PASS=$(openssl rand -base64 18)
              HTPASSWD_CONTENT=$(htpasswd -Bbn "$REG_USER" "$GENERATED_PASS")
              kubectl create secret generic docker-registry-auth -n docker-registry \
                --from-literal=htpasswd="$HTPASSWD_CONTENT" --dry-run=client -o yaml | kubectl apply -f -
              kubectl get secret docker-registry-auth -n docker-registry -o json \
                | jq 'del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields, .metadata.ownerReferences)' \
                | gcloud storage cp - "${REGISTRY_AUTH_CACHE_URI}" 2>/dev/null || true
              echo "::notice::Docker Registry auth secret generated for user '${REG_USER}'. Set DOCKER_REGISTRY_PASSWORD in GitHub Secrets to override."
            fi
          fi

          # Extract chart versions dynamically from Argo CD manifests (Single Source of Truth)
          CERT_MANAGER_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('argocd/apps/cert-manager.yaml'))['spec']['sources'][0]['targetRevision'])" 2>/dev/null || grep 'targetRevision:' argocd/apps/cert-manager.yaml | head -n1 | awk '{print $2}')
          ARGOCD_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('argocd/apps/argocd.yaml'))['spec']['sources'][0]['targetRevision'])" 2>/dev/null || grep 'targetRevision:' argocd/apps/argocd.yaml | head -n1 | awk '{print $2}')

          if ! kubectl get deployment cert-manager -n cert-manager >/dev/null 2>&1; then
            echo "Installing cert-manager (version: ${CERT_MANAGER_VERSION}) via Helm..."
            helm repo add jetstack https://charts.jetstack.io
            helm repo update
            helm upgrade --install cert-manager jetstack/cert-manager \
              --namespace cert-manager \
              --version "${CERT_MANAGER_VERSION}" \
              --values cert-manager/values.yaml \
              --wait
          else
            echo "cert-manager is already installed; Argo CD GitOps manages lifecycle and upgrades."
          fi

          if [ -n "$ACME_EMAIL" ]; then
            echo "Applying Let's Encrypt ClusterIssuers..."
            sed "s/your-email@yourdomain.com/${ACME_EMAIL}/g" cert-manager/cluster-issuers.yaml | kubectl apply -f -
          fi

          if ! kubectl get deployment argocd-server -n argocd >/dev/null 2>&1; then
            echo "Installing Argo CD (version: ${ARGOCD_VERSION}) via Helm..."
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd \
              --version "${ARGOCD_VERSION}" \
              --values argocd/values.yaml \
              --wait
          else
            echo "Argo CD is already installed; Argo CD GitOps manages lifecycle and upgrades."
          fi

          ADMIN_EMAIL="${ARGOCD_ADMIN_EMAIL:-$ACME_EMAIL}"
          if [ -n "$ADMIN_EMAIL" ]; then
            echo "Configuring Argo CD admin RBAC for ${ADMIN_EMAIL}..."
            kubectl -n argocd patch cm argocd-rbac-cm --type merge \
              -p "{\"data\": {\"policy.csv\": \"g, ${ADMIN_EMAIL}, role:admin\"}}" 2>/dev/null || true
          fi

          if [ -n "$CUSTOM_DOMAIN" ]; then
            PROJECT_ID=$(gcloud config get-value project)
            CERT_CACHE_URI="gs://${PROJECT_ID}-tofu-state/certs/argocd-server-tls.json"

            # Restore cached TLS secret from GCS on fresh cluster builds to avoid Let's Encrypt rate limits
            if ! kubectl get secret argocd-server-tls -n argocd >/dev/null 2>&1; then
              if gcloud storage ls "${CERT_CACHE_URI}" >/dev/null 2>&1; then
                echo "Restoring cached argocd-server-tls Secret from ${CERT_CACHE_URI}..."
                gcloud storage cat "${CERT_CACHE_URI}" | kubectl apply -f -
              fi
            fi

            echo "Configuring domain and Let's Encrypt certificates..."
            sed "s/argocd.yourdomain.com/argocd.${CUSTOM_DOMAIN}/g" argocd/certificate.yaml | kubectl apply -f -
            kubectl -n argocd patch cm argocd-cm --type merge \
              -p "{\"data\": {\"url\": \"https://argocd.${CUSTOM_DOMAIN}\"}}" 2>/dev/null || true

            echo "Waiting for Argo CD TLS certificate to be issued..."
            kubectl wait --for=condition=Ready certificate/argocd-server-tls -n argocd --timeout=180s 2>/dev/null || true

            # Persist valid TLS secret to GCS state bucket so cluster destroy/recreate cycles reuse it
            if kubectl get secret argocd-server-tls -n argocd >/dev/null 2>&1; then
              echo "Caching argocd-server-tls Secret to ${CERT_CACHE_URI}..."
              kubectl get secret argocd-server-tls -n argocd -o json \
                | jq 'del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields, .metadata.ownerReferences)' \
                | gcloud storage cp - "${CERT_CACHE_URI}"
            fi

            # Restart argocd-server if it has not yet loaded the issued certificate
            if ! kubectl logs -n argocd deployment/argocd-server --tail=50 2>/dev/null | grep -q "Loading TLS configuration from secret argocd/argocd-server-tls"; then
              echo "Restarting argocd-server to load the issued TLS certificate..."
              kubectl rollout restart deployment argocd-server -n argocd
              kubectl rollout status deployment argocd-server -n argocd --timeout=120s
            else
              echo "argocd-server already has the custom TLS secret loaded."
            fi

            REGISTRY_CERT_CACHE_URI="gs://${PROJECT_ID}-tofu-state/certs/docker-registry-tls.json"

            # Restore cached Docker Registry TLS secret from GCS on fresh cluster builds to avoid Let's Encrypt rate limits
            if ! kubectl get secret docker-registry-tls -n docker-registry >/dev/null 2>&1; then
              if gcloud storage ls "${REGISTRY_CERT_CACHE_URI}" >/dev/null 2>&1; then
                echo "Restoring cached docker-registry-tls Secret from ${REGISTRY_CERT_CACHE_URI}..."
                gcloud storage cat "${REGISTRY_CERT_CACHE_URI}" | kubectl apply -f -
              fi
            fi

            echo "Configuring Docker Registry domain and Let's Encrypt certificates..."
            sed "s/registry.yourdomain.com/registry.${CUSTOM_DOMAIN}/g" argocd/certificate-registry.yaml | kubectl apply -f -

            echo "Waiting for Docker Registry TLS certificate to be issued..."
            kubectl wait --for=condition=Ready certificate/docker-registry-tls -n docker-registry --timeout=180s 2>/dev/null || true

            # Persist valid TLS secret to GCS state bucket so cluster destroy/recreate cycles reuse it
            if kubectl get secret docker-registry-tls -n docker-registry >/dev/null 2>&1; then
              echo "Caching docker-registry-tls Secret to ${REGISTRY_CERT_CACHE_URI}..."
              kubectl get secret docker-registry-tls -n docker-registry -o json \
                | jq 'del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.managedFields, .metadata.ownerReferences)' \
                | gcloud storage cp - "${REGISTRY_CERT_CACHE_URI}"
            fi

            if [ -n "$DOCKER_REGISTRY_PASSWORD" ]; then
              echo "Configuring OCI registry credentials for Argo CD and devops-demo..."
              kubectl create secret docker-registry docker-registry-secret -n devops-demo \
                --docker-server="registry.${CUSTOM_DOMAIN}" \
                --docker-username="$REG_USER" \
                --docker-password="$DOCKER_REGISTRY_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -

              kubectl create secret generic argocd-oci-registry -n argocd \
                --from-literal=type=helm \
                --from-literal=name=oci-charts \
                --from-literal=url="registry.${CUSTOM_DOMAIN}/charts" \
                --from-literal=enableOCI=true \
                --from-literal=username="$REG_USER" \
                --from-literal=password="$DOCKER_REGISTRY_PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl label secret argocd-oci-registry -n argocd \
                argocd.argoproj.io/secret-type=repository --overwrite
            fi
          fi

          echo "Bootstrapping Argo CD Root Application..."
          kubectl apply -f argocd/bootstrap/root-app.yaml

          if [ -n "$CUSTOM_DOMAIN" ] && [ -f argocd/apps/devops-demo.yaml ]; then
            # Allow Argo CD controller to reconcile root-apps ignoreDifferences/RespectIgnoreDifferences
            # before patching devops-demo with the custom registry domain.
            for _ in $(seq 1 10); do
              PHASE=$(kubectl get application root-apps -n argocd -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
              if [ "$PHASE" != "Running" ]; then
                break
              fi
              sleep 2
            done
            sleep 2
            echo "Applying devops-demo Argo CD Application with custom registry domain..."
            sed "s/registry.yourdomain.com/registry.${CUSTOM_DOMAIN}/g" argocd/apps/devops-demo.yaml | kubectl apply -f -
          fi

          echo "Deployment and bootstrap sequence finished successfully!"

      - name: Resolve Cloudflare Credentials & Domain
        if: steps.changes.outputs.run_cloudflare == 'true'
        env:
          RAW_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          RAW_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAW_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          RAW_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          api_token = os.environ.get("RAW_API_TOKEN", "").strip()
          tunnel_token = os.environ.get("RAW_TUNNEL_TOKEN", "").strip()
          account_id = os.environ.get("RAW_ACCOUNT_ID", "").strip()
          tunnel_id = os.environ.get("RAW_TUNNEL_ID", "").strip()
          domain = os.environ.get("RAW_DOMAIN", "").strip()

          if (not account_id or not tunnel_id) and tunnel_token:
              try:
                  padded = tunnel_token + "=" * (-len(tunnel_token) % 4)
                  payload = json.loads(base64.b64decode(padded).decode("utf-8"))
                  if not account_id:
                      account_id = str(payload.get("a", "")).strip()
                  if not tunnel_id:
                      tunnel_id = str(payload.get("t", "")).strip()
              except Exception as exc:
                  print(f"::warning::Unable to decode account/tunnel IDs from CLOUDFLARED_TUNNEL_TOKEN: {exc}")

          missing = []
          if not api_token:
              missing.append("CLOUDFLARE_TUNNEL_API_TOKEN (or CLOUDFLARE_API_TOKEN)")
          if not account_id:
              missing.append("CLOUDFLARE_ACCOUNT_ID (or valid CLOUDFLARED_TUNNEL_TOKEN)")
          if not tunnel_id:
              missing.append("CLOUDFLARE_TUNNEL_ID (or valid CLOUDFLARED_TUNNEL_TOKEN)")
          if not domain:
              missing.append("CUSTOM_DOMAIN")

          if missing:
              print("::error::Missing required GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)

          print(f"::add-mask::{account_id}")
          print(f"::add-mask::{tunnel_id}")
          print(f"::add-mask::{domain}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CLOUDFLARE_API_TOKEN={api_token}\n")
              env_file.write(f"TF_VAR_account_id={account_id}\n")
              env_file.write(f"TF_VAR_tunnel_id={tunnel_id}\n")
              env_file.write(f"TF_VAR_domain={domain}\n")
          PY

      - name: OpenTofu Init & Format / Validate (Cloudflare)
        if: steps.changes.outputs.run_cloudflare == 'true'
        run: |
          PROJECT_ID=$(gcloud config get-value project)

          cd tofu/cloudflare
          tofu fmt -check
          tofu init \
            -backend-config="bucket=${PROJECT_ID}-tofu-state" \
            -backend-config="prefix=cloudflare-tunnel"
          tofu validate

      - name: Verify Cloudflare API Token Permissions
        if: steps.changes.outputs.run_cloudflare == 'true'
        run: |
          VERIFY_ACCT=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_account_id}/tokens/verify")
          if [ "$(printf '%s' "$VERIFY_ACCT" | jq -r '.success')" = "true" ]; then
            echo "Account API token verified: status=$(printf '%s' "$VERIFY_ACCT" | jq -r '.result.status')"
          else
            VERIFY_USER=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify")
            if [ "$(printf '%s' "$VERIFY_USER" | jq -r '.success')" = "true" ]; then
              echo "User API token verified: status=$(printf '%s' "$VERIFY_USER" | jq -r '.result.status')"
            else
              echo "::error::Cloudflare API token verification failed. Check that CLOUDFLARE_API_TOKEN is valid and not truncated or expired."
              printf '%s\n' "$VERIFY_ACCT" | jq -c '.errors // .'
              exit 1
            fi
          fi

          ZONE_CHECK=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${TF_VAR_domain}")
          if [ "$(printf '%s' "$ZONE_CHECK" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare Zone lookup failed. Ensure the token has Zone:Read and DNS:Edit permissions for the domain (if scoped to 'Specific domains', try 'All domains' if /zones list still returns 9109)."
            printf '%s\n' "$ZONE_CHECK" | jq -c '.errors // .'
            exit 1
          fi
          echo "Cloudflare Zone lookup succeeded."

          TUNNEL_CHECK=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_account_id}/cfd_tunnel/${TF_VAR_tunnel_id}/configurations")
          if [ "$(printf '%s' "$TUNNEL_CHECK" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare Tunnel config read failed. Ensure the token has 'Cloudflare One Connector: cloudflared: Write' (or 'Cloudflare Tunnel: Edit') under Entire account."
            printf '%s\n' "$TUNNEL_CHECK" | jq -c '.errors // .'
            exit 1
          fi
          echo "Cloudflare Tunnel config access verified."

      - name: Import Existing Cloudflare Resources (Before Apply)
        if: steps.changes.outputs.run_cloudflare == 'true' && env.ACTION == 'apply' && github.event_name != 'pull_request'
        run: |
          cd tofu/cloudflare
          STATE_LIST=$(tofu state list 2>/dev/null || true)

          TUNNEL_ADDR="cloudflare_zero_trust_tunnel_cloudflared_config.tunnel"
          if ! printf '%s\n' "$STATE_LIST" | grep -qxF "$TUNNEL_ADDR"; then
            TUNNEL_RESP=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${TF_VAR_account_id}/cfd_tunnel/${TF_VAR_tunnel_id}/configurations")
            if [ "$(printf '%s' "$TUNNEL_RESP" | jq -r '.success == true and .result.config != null')" = "true" ]; then
              echo "Importing existing Cloudflare Tunnel configuration into OpenTofu state..."
              tofu import -input=false "$TUNNEL_ADDR" "${TF_VAR_account_id}/${TF_VAR_tunnel_id}"
            else
              echo "No existing remote tunnel configuration found to import; OpenTofu will create it."
            fi
          fi

          ZONE_RESP=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${TF_VAR_domain}")
          if [ "$(printf '%s' "$ZONE_RESP" | jq -r '.success')" != "true" ]; then
            echo "::error::Failed to query Cloudflare Zones API. Ensure the API token has Zone:Read, DNS:Edit, and Cloudflare One Connector: cloudflared: Write permissions."
            printf '%s\n' "$ZONE_RESP" | jq -c '.errors // .'
            exit 1
          fi

          ZONE_ID=$(printf '%s' "$ZONE_RESP" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not find Cloudflare Zone for configured CUSTOM_DOMAIN."
            exit 1
          fi
          echo "::add-mask::${ZONE_ID}"

          SUBDOMAINS=$(python3 - <<'PY'
          import re

          seen = set()
          with open("routes.yaml", encoding="utf-8") as f:
              for line in f:
                  line = line.split("#", 1)[0].strip()
                  m = re.match(r"^(?:-\s*)?subdomain:\s*['\"]?([A-Za-z0-9._-]+)['\"]?$", line)
                  if m and m.group(1) not in seen:
                      seen.add(m.group(1))
                      print(m.group(1))
          PY
          )
          for SUBDOMAIN in $SUBDOMAINS; do
            DNS_ADDR="cloudflare_dns_record.route[\"${SUBDOMAIN}\"]"
            if printf '%s\n' "$STATE_LIST" | grep -qxF "$DNS_ADDR"; then
              continue
            fi

            FQDN="${SUBDOMAIN}.${TF_VAR_domain}"
            CNAME_RESP=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${FQDN}")
            RECORD_ID=$(printf '%s' "$CNAME_RESP" | jq -r '.result[0].id // empty')

            if [ -n "$RECORD_ID" ]; then
              echo "Importing existing CNAME record for route '${SUBDOMAIN}'..."
              tofu import -input=false "$DNS_ADDR" "${ZONE_ID}/${RECORD_ID}"
            else
              CONFLICT_RESP=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=${FQDN}")
              CONFLICT_TYPE=$(printf '%s' "$CONFLICT_RESP" | jq -r '.result[0].type // empty')
              if [ -n "$CONFLICT_TYPE" ]; then
                echo "::error::Existing ${CONFLICT_TYPE} DNS record conflicts with CNAME for route '${SUBDOMAIN}'. Remove or convert it in Cloudflare DNS first."
                exit 1
              fi
            fi
          done

      - name: OpenTofu Plan (Cloudflare)
        if: steps.changes.outputs.run_cloudflare == 'true'
        run: |
          cd tofu/cloudflare
          tofu plan -input=false -out=tfplan

      - name: OpenTofu Apply (Cloudflare)
        if: steps.changes.outputs.run_cloudflare == 'true' && env.ACTION == 'apply' && github.event_name != 'pull_request'
        run: |
          cd tofu/cloudflare
          tofu apply -input=false -auto-approve tfplan
