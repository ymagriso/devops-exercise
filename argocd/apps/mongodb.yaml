apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: mongodb
      targetRevision: 16.5.45
      helm:
        releaseName: mongodb
        valueFiles:
          - $values/mongodb/values.yaml
    - repoURL: https://github.com/ymagriso/devops-exercise.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb
  # Bitnami's chart generates random passwords in Secret/mongodb when rendered via
  # `helm template`. Ignoring /data combined with RespectIgnoreDifferences=true and
  # ApplyOutOfSyncOnly=true ensures the Secret is created on initial sync and never
  # overwritten on subsequent reconciliations.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: mongodb
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
