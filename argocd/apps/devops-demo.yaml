apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: registry.yourdomain.com/charts
    chart: devops-demo
    targetRevision: 1.0.0
    helm:
      releaseName: devops-demo
      valuesObject:
        image:
          repository: registry.yourdomain.com/devops-demo
          tag: 1.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
