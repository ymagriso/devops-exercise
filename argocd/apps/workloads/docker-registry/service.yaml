apiVersion: v1
kind: Service
metadata:
  name: docker-registry
  namespace: docker-registry
  labels:
    app.kubernetes.io/name: docker-registry
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: 5000
      protocol: TCP
    - name: registry
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app.kubernetes.io/name: docker-registry
