apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Rancher System Upgrade Controller (SUC): performs rolling, in-place upgrades of
# RKE2 on the cluster nodes, driven by upgrade.cattle.io/v1 Plan resources.
# Upstream release manifests are pinned to a release tag; Renovate bumps both URLs.
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.0/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.21.0/system-upgrade-controller.yaml
